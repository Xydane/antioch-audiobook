name: Release Binaries

# Compatible with both GitHub Actions and Gitea Actions.
#
# Gitea requirement: your Gitea instance must have
#   DEFAULT_ACTIONS_URL = https://github.com
# in app.ini ([actions] section) so that short-form `uses:` entries
# resolve to GitHub-hosted actions. This is the default on most
# self-hosted Gitea setups.
#
# The release step uses softprops/action-gh-release, which reads
# GITHUB_API_URL from the runner environment. GitHub sets this to
# https://api.github.com; Gitea sets it to its own API endpoint.
# Either way the action works without modification.
#
# secrets.GITHUB_TOKEN is auto-provided by both GitHub and Gitea 1.19+.
#
# ── Build architecture ────────────────────────────────────────────────────────
# antioch links two native C++ libraries as static archives, baked directly
# into the single output binary:
#
#   - llama.cpp  (--features llama) — local LLM backend (GGUF)
#   - qwentts.cpp (--features ggml) — local TTS backend (GGUF, Qwen3-TTS)
#
# Both are built against the *same* ggml source (qwentts.cpp's ggml/ fork,
# copied over llama.cpp's own ggml/ directory — see README.md "The shared
# ggml story") so their compiled ggml archives are interchangeable; only one
# copy is linked into the final binary (see build.rs).
#
# GPU acceleration uses Vulkan (-DGGML_VULKAN=ON) rather than CUDA, since
# Vulkan works across NVIDIA/AMD/Intel GPUs and needs no vendor SDK on the
# CI runner beyond the Vulkan loader + glslc shader compiler.
#
# GGML_OPENMP=OFF on every platform/every build: build.rs links the static
# ggml-cpu / ggml-base archives directly via `cargo:rustc-link-lib`, which
# bypasses CMake's `target_link_libraries(ggml-cpu OpenMP::OpenMP_C
# OpenMP::OpenMP_CXX)` — so the OpenMP runtime (libgomp / VCOMP140.DLL) never
# gets linked and ggml-cpu.c's GOMP_*/omp_* symbols are left undefined at
# link time. ggml-cpu's own pthread-based thread pool is used instead; this
# only affects CPU fallback threading — the GPU backend (Vulkan/Metal) is
# unaffected. On Windows this also avoids a *runtime* dependency on
# VCOMP140.DLL, which ships with Visual Studio / the VC++ Redistributable,
# not with a clean Windows install.
#
# The binary is statically linked (llama.cpp, qwentts.cpp, ggml, C++ runtime
# all baked in) except for a small number of unavoidable OS-level runtime
# dependencies per platform:
#
#   Linux   — libc.so.6 (glibc) + libvulkan.so.1 (Vulkan loader). Both are
#             *hard* DT_NEEDED dependencies of the Vulkan ggml backend — the
#             binary will not start at all if libvulkan.so.1 is missing, even
#             for CPU-only use. libvulkan1 / GPU drivers are present on
#             virtually any desktop Linux install.
#   Windows — vulkan-1.dll (Vulkan loader), shipped by GPU drivers and
#             present on virtually any Windows 10/11 install with a GPU.
#             MSVC CRT is statically linked (/MT), so no VC++ Redistributable
#             is required.
#   macOS   — none. Metal is a system framework, always present; no Vulkan
#             loader is needed since qwentts.cpp/llama.cpp use ggml's native
#             Metal backend on Apple platforms instead of Vulkan.
#
# Windows and macOS build on *native* runners (windows-2022 / macos-14)
# rather than cross-compiling from Linux: both projects' Vulkan backend
# requires `glslc`/SPIRV-Headers with a matching target toolchain, and the
# Metal backend hard-depends on Apple's Foundation/Metal/MetalKit frameworks
# and the `xcrun`/`metal` shader compiler, none of which are available (or,
# for Xcode, licensed to run) on Linux.

on:
  push:
    tags:
      - "v*"
    branches:
      - dev

# Allow the release job to create releases and upload assets
permissions:
  contents: write

env:
  # Pin llama.cpp to the commit known to vendor ggml 0.17.0 in-tree, matching
  # the version qwentts.cpp's ggml fork is based on (see README.md).
  LLAMA_COMMIT: 7d56da7

jobs:
  # ── Linux x86_64 (glibc, static llama.cpp + qwentts.cpp, Vulkan) ──────────────
  build-linux:
    name: Linux x86_64 (static, Vulkan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout antioch
        uses: actions/checkout@v4
        with:
          path: antioch

      - name: Install build dependencies (CMake, Vulkan SDK, shader compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libvulkan-dev glslc glslang-tools libshaderc-dev spirv-tools spirv-headers

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & git deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            antioch/target
          key: linux-static-vulkan-${{ hashFiles('antioch/Cargo.lock') }}
          restore-keys: linux-static-vulkan-

      - name: Clone qwentts.cpp (with ggml submodule)
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/Xydane/qwentts.cpp.git

      - name: Build qwentts.cpp (static, Vulkan)
        run: |
          cd qwentts.cpp
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DQWEN_SHARED=OFF \
            -DGGML_VULKAN=ON \
            -DGGML_OPENMP=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY=${{ github.workspace }}/qwentts.cpp/build/lib
          cmake --build build --config Release -j"$(nproc)"

      - name: Clone llama.cpp (pinned commit) and unify ggml
        run: |
          git clone https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          git checkout "${LLAMA_COMMIT}"
          # Replace llama.cpp's vendored ggml with qwentts.cpp's fork so both
          # native libraries compile from byte-identical ggml source — this
          # lets build.rs link a single copy of the ggml static archives into
          # the final binary instead of two conflicting copies.
          rm -rf ggml
          # -L: dereference symlinks when copying. qwentts.cpp's ggml
          # submodule contains an unrelated agent-instructions symlink
          # (.pi/SYSTEM.md -> gg/SYSTEM.md); MSYS's cp on Windows cannot
          # recreate that as a real symlink without Developer Mode/admin,
          # which fails the whole copy. Copying file contents instead is
          # fine since nothing in the build depends on it being a symlink.
          cp -rL ../qwentts.cpp/ggml .

      - name: Build llama.cpp (static, Vulkan)
        run: |
          cd llama.cpp
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_VULKAN=ON \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY=${{ github.workspace }}/llama.cpp/build/lib
          cmake --build build --config Release -j"$(nproc)"

      - name: List built static archives (sanity check)
        run: |
          echo "--- qwentts.cpp/build/lib ---"
          ls -la qwentts.cpp/build/lib/
          echo "--- llama.cpp/build/lib ---"
          ls -la llama.cpp/build/lib/

      - name: Build antioch (static, ggml + llama features)
        run: |
          cd antioch
          cargo build --release --features "ggml llama" \
            --target x86_64-unknown-linux-gnu
        env:
          QWENTTS_LIB_DIR: ${{ github.workspace }}/qwentts.cpp/build/lib
          QWENTTS_VULKAN: "1"
          LLAMA_LIB_DIR: ${{ github.workspace }}/llama.cpp/build/lib
          LLAMA_VULKAN: "1"
          # Statically link the C++ runtime (libstdc++, libgcc) so the only
          # remaining runtime dependencies are libc and libvulkan.
          RUSTFLAGS: "-C link-arg=-static-libstdc++ -C link-arg=-static-libgcc"

      - name: Verify dynamic dependencies (informational)
        run: |
          cd antioch
          file target/x86_64-unknown-linux-gnu/release/antioch
          ldd target/x86_64-unknown-linux-gnu/release/antioch || true

      - name: Package
        run: |
          cd antioch
          cp target/x86_64-unknown-linux-gnu/release/antioch antioch
          tar -czf antioch-${{ github.ref_name }}-linux-x86_64.tar.gz antioch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: antioch/antioch-*.tar.gz

  # ── Windows x86_64 (static llama.cpp + qwentts.cpp, Vulkan) ──────────────────
  build-windows:
    name: Windows x86_64 (static, Vulkan)
    runs-on: windows-2022
    env:
      VULKAN_VERSION: 1.4.313.2
    steps:
      - name: Checkout antioch
        uses: actions/checkout@v4
        with:
          path: antioch

      - name: Install Rust stable + Windows target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install CMake / Ninja
        shell: bash
        run: |
          choco install cmake ninja --no-progress

      # windows-2022 runners have C:\mingw64 on PATH by default, so without
      # forcing MSVC, CMake silently picks up MinGW's g++ instead of cl.exe.
      # That breaks two things: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded is
      # an MSVC-only setting (silently ignored under GCC), and — observed in
      # practice — the resulting vulkan-shaders-gen.exe crashes at startup
      # with STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139) when the runner's PATH
      # resolves its MinGW libstdc++/libgcc DLLs to a mismatched copy. Setting
      # up the MSVC dev environment (adds cl.exe's dir to PATH ahead of
      # mingw64) and pinning CC/CXX to cl for the two cmake configure steps
      # below avoids MinGW entirely.
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Vulkan SDK (glslc + headers + vulkan-1.lib)
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          curl.exe -L -o $installer $url
          & $installer --accept-licenses --default-answer --confirm-command install
          "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "C:\VulkanSDK\${env:VULKAN_VERSION}\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Clone qwentts.cpp (with ggml submodule)
        shell: bash
        # ggml is a git submodule of qwentts.cpp and must be populated for the
        # build (and to copy its fork into llama.cpp below).  A plain --depth 1
        # clone leaves the ggml/ dir empty and the build fails at configure.
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/Xydane/qwentts.cpp.git

      - name: Build qwentts.cpp (static, Vulkan)
        shell: bash
        run: |
          cd qwentts.cpp
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DBUILD_SHARED_LIBS=OFF -DQWEN_SHARED=OFF -DGGML_VULKAN=ON \
            -DGGML_OPENMP=OFF \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/qwentts.cpp/build/lib"
          # GGML_OPENMP=OFF: MSVC's OpenMP runtime (VCOMP140.DLL) is a dynamic
          # DLL that is NOT part of the static MSVC CRT — it ships with Visual
          # Studio / the VC++ redistributable, so leaving it on would break the
          # "single portable binary, no VC++ Redistributable" promise on a clean
          # Windows install.  ggml's Vulkan backend does the heavy lifting on the
          # GPU anyway; the CPU fallback just runs single-threaded.
          #
          # Ninja parallelises by default; -j is omitted (nproc is unavailable in
          # Git Bash on Windows).  qwentts.cpp's CMakeLists declares
          # cmake_minimum_required(3.14) — below the 3.15 threshold where policy
          # CMP0091 (MSVC_RUNTIME_LIBRARY) is NEW by default — so the plain
          # -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded flag is silently ignored and
          # the objects default to /MD (dynamic CRT), which then mismatches
          # llama.cpp's /MT static CRT at link time (LNK2038).  Forcing the policy
          # to NEW makes the /MT flag take effect so the final exe needs no VC++
          # Redistributable.
          cmake --build build --config Release

      - name: Clone llama.cpp (pinned commit) and unify ggml
        shell: bash
        run: |
          git clone https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          git checkout "${LLAMA_COMMIT}"
          rm -rf ggml
          # -L: dereference symlinks when copying. qwentts.cpp's ggml
          # submodule contains an unrelated agent-instructions symlink
          # (.pi/SYSTEM.md -> gg/SYSTEM.md); MSYS's cp on Windows cannot
          # recreate that as a real symlink without Developer Mode/admin,
          # which fails the whole copy. Copying file contents instead is
          # fine since nothing in the build depends on it being a symlink.
          cp -rL ../qwentts.cpp/ggml .

      - name: Build llama.cpp (static, Vulkan)
        shell: bash
        run: |
          cd llama.cpp
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DBUILD_SHARED_LIBS=OFF -DGGML_VULKAN=ON \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_APP=OFF \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/llama.cpp/build/lib"
          cmake --build build --config Release

      - name: Build antioch (static, ggml + llama features)
        shell: bash
        run: |
          cd antioch
          cargo build --release --features "ggml llama" --target x86_64-pc-windows-msvc
        env:
          QWENTTS_LIB_DIR: ${{ github.workspace }}/qwentts.cpp/build/lib
          QWENTTS_VULKAN: "1"
          LLAMA_LIB_DIR: ${{ github.workspace }}/llama.cpp/build/lib
          LLAMA_VULKAN: "1"
          # +crt-static matches the C++ libraries' /MT (static MSVC CRT) and
          # statically links Rust's copy of the CRT too.
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Package
        shell: bash
        run: |
          cd antioch
          cp target/x86_64-pc-windows-msvc/release/antioch.exe antioch.exe
          # 7-Zip ships on windows-2022 runners
          7z a -tzip antioch-${{ github.ref_name }}-windows-x86_64.zip antioch.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: antioch/antioch-*.zip

  # ── macOS (Apple Silicon, static llama.cpp + qwentts.cpp, Metal) ─────────────
  build-macos:
    name: macOS arm64 (static, Metal)
    runs-on: macos-14
    steps:
      - name: Checkout antioch
        uses: actions/checkout@v4
        with:
          path: antioch

      - name: Install Rust stable + macOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install CMake / Ninja
        run: brew install cmake ninja

      - name: Clone qwentts.cpp (with ggml submodule)
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/Xydane/qwentts.cpp.git

      - name: Build qwentts.cpp (static, Metal)
        run: |
          cd qwentts.cpp
          # GGML_METAL is ON by default on Apple; Metal embeds the .metallib in
          # the binary (GGML_METAL_EMBED_LIBRARY defaults to ON when Metal is on)
          # so the executable stays fully self-contained.
          #
          # GGML_OPENMP=OFF: build.rs links the static ggml-cpu/ggml-base
          # archives directly via rustc-link-lib, bypassing CMake's
          # target_link_libraries(... OpenMP::OpenMP_C OpenMP::OpenMP_CXX), so
          # the OpenMP runtime never gets linked and ggml-cpu.c's GOMP_*/omp_*
          # symbols are left undefined. ggml-cpu falls back to its own pthread
          # thread pool when OpenMP is off. GPU work runs on Metal regardless.
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DQWEN_SHARED=OFF -DGGML_METAL=ON \
            -DGGML_OPENMP=OFF -DGGML_BLAS=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/qwentts.cpp/build/lib"
          cmake --build build --config Release -j"$(( $(sysctl -n hw.ncpu) + 1 ))"

      - name: Clone llama.cpp (pinned commit) and unify ggml
        run: |
          git clone https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          git checkout "${LLAMA_COMMIT}"
          rm -rf ggml
          # -L: dereference symlinks when copying. qwentts.cpp's ggml
          # submodule contains an unrelated agent-instructions symlink
          # (.pi/SYSTEM.md -> gg/SYSTEM.md); MSYS's cp on Windows cannot
          # recreate that as a real symlink without Developer Mode/admin,
          # which fails the whole copy. Copying file contents instead is
          # fine since nothing in the build depends on it being a symlink.
          cp -rL ../qwentts.cpp/ggml .

      - name: Build llama.cpp (static, Metal)
        run: |
          cd llama.cpp
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DGGML_METAL=ON \
            -DGGML_OPENMP=OFF -DGGML_BLAS=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_APP=OFF \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/llama.cpp/build/lib"
          cmake --build build --config Release -j"$(( $(sysctl -n hw.ncpu) + 1 ))"

      - name: Build antioch (static, ggml + llama features)
        run: |
          cd antioch
          cargo build --release --features "ggml llama" --target aarch64-apple-darwin
        env:
          QWENTTS_LIB_DIR: ${{ github.workspace }}/qwentts.cpp/build/lib
          QWENTTS_METAL: "1"
          LLAMA_LIB_DIR: ${{ github.workspace }}/llama.cpp/build/lib
          LLAMA_METAL: "1"

      - name: Package
        run: |
          cd antioch
          cp target/aarch64-apple-darwin/release/antioch antioch
          tar -czf antioch-${{ github.ref_name }}-macos-arm64.tar.gz antioch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: antioch/antioch-*.tar.gz

  # ── Create release ───────────────────────────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip | tee sha256sums.txt

      - name: Create release
        # softprops/action-gh-release reads GITHUB_API_URL from the runner
        # environment, which GitHub sets to https://api.github.com and Gitea
        # sets to its own API — no platform-specific config required.
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "antioch ${{ github.ref_name }}"
          body: |
            ## antioch ${{ github.ref_name }}

            Markdown → M4B audiobook generator. Single portable binary — no Python required.

            ### Downloads
            | Platform | File |
            |----------|------|
            | Linux x86_64 (static, Vulkan) | `antioch-${{ github.ref_name }}-linux-x86_64.tar.gz` |
            | Windows x86_64 (static, Vulkan) | `antioch-${{ github.ref_name }}-windows-x86_64.zip` |
            | macOS arm64 (static, Metal) | `antioch-${{ github.ref_name }}-macos-arm64.tar.gz` |

            ### Hardware acceleration
            This release binary is built with `--features "ggml llama"`:
            - **LLM** — llama.cpp, statically linked, GGUF models
            - **TTS** — qwentts.cpp (Qwen3-TTS), statically linked, GGUF models

            GGML GPU backends, per platform:
            - **Linux / Windows** — **Vulkan** (works across NVIDIA/AMD/Intel GPUs)
            - **macOS** — **Metal** (Apple's native GPU API)

            Each binary falls back to the CPU backend automatically if no
            compatible GPU is found.

            ### Runtime dependencies
            The binaries are statically linked except for a few unavoidable
            OS-level runtime libraries:
            - **Linux** — `libc.so.6` (glibc) and `libvulkan.so.1` (Vulkan loader).
              Both are hard dependencies of the Vulkan ggml backend, so the binary
              will not start if `libvulkan.so.1` is missing (it ships with GPU
              drivers / `libvulkan1` on virtually all desktop Linux installs).
            - **Windows** — `vulkan-1.dll` (Vulkan loader), shipped with GPU
              drivers on virtually all Windows 10/11 installs. MSVC CRT is
              statically linked, so no VC++ Redistributable is required.
            - **macOS** — none. Metal is a system framework always present on macOS.

            Model weights are **not** bundled — they auto-download from
            HuggingFace on first use (see README.md), or run `antioch fetch` ahead
            of time.

            ### Verify checksums
            ```bash
            sha256sum -c sha256sums.txt
            ```
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt
