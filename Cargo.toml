[package]
name = "antioch"
version = "0.1.0"
edition = "2021"
description = "Markdown → M4B audiobook generator (llama.cpp LLM + qwentts.cpp TTS, no Python required)"
authors = ["Xydane"]
license = "MIT"

[[bin]]
name = "antioch"
path = "src/main.rs"

[dependencies]
# ── CLI & UX ──────────────────────────────────────────────────────────────────
clap        = { version = "4", features = ["derive", "env"] }
indicatif   = "0.17"
console     = "0.15"

# ── Error handling & logging ──────────────────────────────────────────────────
anyhow              = "1"
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "fmt"] }

# ── Serialization ─────────────────────────────────────────────────────────────
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process"] }

# ── Utilities ─────────────────────────────────────────────────────────────────
dirs        = "5"
regex       = "1"
once_cell   = "1"
async-trait = "0.1"

# ── Markdown parsing (pure Rust) ──────────────────────────────────────────────
pulldown-cmark = "0.12"

# ── HuggingFace Hub ──────────────────────────────────────────────────────────
# ureq = sync blocking client, pure-Rust TLS via rustls (no OpenSSL, no tokio feature needed)
hf-hub      = { version = "0.5", default-features = false, features = ["ureq"] }

# ── HTTP for LLM API mode (rustls-tls → no OpenSSL, fully static-linkable) ───
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ── Audio (pure Rust) ─────────────────────────────────────────────────────────
hound  = "3"
rubato = "0.15"

[features]
default = []

# qwentts.cpp TTS backend — GGML-based Qwen3-TTS native library.
# Set QWENTTS_LIB_DIR to the qwentts.cpp build directory (see build.rs).
ggml = []

# llama.cpp LLM backend — GGML-based local LLM native library.
# Set LLAMA_LIB_DIR to the llama.cpp build bin/ directory (see build.rs).
llama = []

[profile.release]
opt-level = 3
lto       = false   # thin-LTO triggers rustc SIGSEGV on some toolchains
strip     = true    # strip debug symbols → smaller portable binary

# Debug-info variant of release: full DWARF, no stripping, optimised.
# Build with: cargo build --profile release-dbg --features rocm
[profile.release-dbg]
inherits  = "release"
strip     = false
debug     = true
